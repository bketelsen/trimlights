# Check, then publish images. Actions are pinned to full commit SHAs and each
# job gets only the permissions it needs (frostyard/core ADR-0021). The build
# job runs pnpm and the Go build without a write token. The publish job pushes
# and attests; the promote job moves :main. Both hold packages: write, only
# publish holds id-token and attestations, and neither runs repository build
# code (ADR-0015).
name: Check
on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

permissions: {}

# Pull requests share one group per PR and cancel superseded runs. Every other
# run gets its own group: GitHub keeps only 1 pending run per group and cancels
# the rest, so a shared group could drop a main run before it publishes.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
      # The locked golangci-lint, checksum-verified, as `mise install` does
      # (frostyard/core ADR-0043; ADR-0016).
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: golangci-lint
          cache: true
      # verify (tidy, format, vet, lint, race tests, doc links), then the
      # frontend tests and build and the binary build.
      - run: make ci

  # govulncheck needs the network for its database, so it stays out of
  # make ci (ADR-0016). Its release is pinned in the Makefile, and the Go
  # checksum database verifies the module.
  vulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: make vulncheck

  # Main pushes and vX.Y.Z tags compile both architectures here, with no write
  # token and no id-token, and hand the static binaries to the publish job.
  build:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Choose the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            printf '%s\n' "$GITHUB_REF_NAME" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+' || {
              echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.25.0'
      - name: Compile static binaries
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          GOOS=linux GOARCH=amd64 make build VERSION="$BUILD_VERSION" COMMIT="$BUILD_COMMIT" BUILT_BY=github-actions
          GOOS=linux GOARCH=arm64 make build VERSION="$BUILD_VERSION" COMMIT="$BUILD_COMMIT" BUILT_BY=github-actions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: |
            build/amd64/trimlight
            build/arm64/trimlight
          if-no-files-found: error
          retention-days: 7

  # Packages the prebuilt binaries into the scratch image, pushes it and attests
  # its digest. No pnpm, Node or Go runs here; the Containerfile only copies.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/bketelsen/trimlights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: build
      # Artifacts do not keep file modes.
      - name: Check the binaries
        run: |
          chmod 0755 build/amd64/trimlight build/arm64/trimlight
          file build/amd64/trimlight build/arm64/trimlight
      - name: Choose the tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$IMAGE:$VERSION"
          else
            # The live app pulls :main and :sha-<commit> today; keep both.
            # :sha-<commit> is pushed here; the promote job moves :main.
            tags="$IMAGE:sha-$GITHUB_SHA"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/bketelsen/trimlights
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records need an organization-owned repository.
          create-storage-record: false
      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "Pushed $TAGS"
            echo
            echo "Digest: \`$IMAGE@$DIGEST\`"
            echo
            echo "Verify: \`gh attestation verify oci://$IMAGE@$DIGEST --repo bketelsen/trimlights\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Moves :main to the image of the current head of main, not to this run's
  # commit. Promotions are serialized across runs. GitHub can replace a pending
  # promote job with a newer one; nothing is lost, because every promote job
  # that runs reads the head again. If the head image is not pushed yet, the
  # job skips and the head's own run promotes it later, so :main can lag the
  # head for a short time. :sha-<commit> and :vX.Y.Z tags are never changed here.
  promote:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: promote-main
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/bketelsen/trimlights
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The registry API tells "no such tag" (404) apart from every other error;
      # only a 404 for the head image skips. Any other status fails the job.
      # If the check after the retag fails, the job fails; the next promotion
      # moves :main to the head image again and repairs it. :sha-<commit> tags
      # are never touched.
      - name: Move :main to the image of the head of main
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          printf '%s\n' "$head" | grep -Eqx '[0-9a-f]{40}' || { echo "bad head SHA: $head" >&2; exit 1; }

          token=$(curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "https://ghcr.io/token?scope=repository:bketelsen/trimlights:pull" | jq -r '.token // empty')
          [ -n "$token" ] || { echo "GHCR returned no pull token" >&2; exit 1; }
          echo "::add-mask::$token"

          headers=$(mktemp)
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          # Sets status (000 on a transport error) and digest for 1 reference.
          manifest() {
            : > "$headers"
            status=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -I \
              -H "Authorization: Bearer $token" -H "Accept: $accept" \
              "https://ghcr.io/v2/bketelsen/trimlights/manifests/$1") || true
            digest=$(tr -d '\r' < "$headers" | awk 'tolower($1) == "docker-content-digest:" { d = $2 } END { print d }')
          }

          manifest "sha-$head"
          case "$status" in
            200) ;;
            404)
              echo "Skipped :main: $IMAGE:sha-$head is not pushed yet; its own run promotes it." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
            *)
              echo "GHCR answered $status for $IMAGE:sha-$head" >&2
              exit 1 ;;
          esac
          want=$digest
          printf '%s\n' "$want" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "bad digest for sha-$head: $want" >&2; exit 1; }

          docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE@$want"

          manifest main
          [ "$status" = 200 ] || { echo "GHCR answered $status for $IMAGE:main" >&2; exit 1; }
          [ "$digest" = "$want" ] || { echo ":main is $digest, expected $want" >&2; exit 1; }
          echo "Moved :main to $IMAGE@$want (head $head)." >> "$GITHUB_STEP_SUMMARY"
