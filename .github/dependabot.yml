# Weekly dependency updates (issue #20). Minor and patch updates are grouped
# per ecosystem; major updates arrive as single PRs. The Containerfile is FROM
# scratch, so it has no base image to update. Dependabot alerts and security
# updates are repository settings, not part of this file.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    # golang.org/x/crypto/x509roots/fallback (the CA roots of the scratch image)
    # is a nested module with no version tags, only pseudo-versions. Dependabot
    # takes the tag of golang.org/x/crypto (v0.58.0 on 2026-10-31), which does
    # not contain the package, and the whole gomod job fails with
    # dependency_file_not_resolvable. Update it by hand:
    #   go get golang.org/x/crypto/x509roots/fallback@latest && go mod tidy
    ignore:
      - dependency-name: golang.org/x/crypto/x509roots/fallback

  # npm covers pnpm: Dependabot updates web/pnpm-lock.yaml with package.json.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    # @types/node follows the Node runtime major, which stays on 24: CI pins
    # node-version 24.19.0 and web/package.json has engines.node >=24.19.0
    # (Brian, 2026-11-01). Newer type majors could accept APIs that Node 24
    # lacks. A runtime move changes CI, engines.node and @types/node together.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keeps the SHA pins and their version comments in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
