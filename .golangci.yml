version: "2"

# Code style configuration for golangci-lint (v2 schema), copied from
# frostread (ADR-0016). `make lint` runs `golangci-lint run`, which reads this
# file, in `make verify` and so in `make ci`, which the Check workflow's check
# job runs with golangci-lint installed by jdx/mise-action. The linter release
# itself is pinned in mise.toml, with its checksums in mise.lock — the CI job
# installs exactly that version and `make lint` warns when the local binary
# differs — so local and CI results should not drift silently.
# Pins the defaults the repo has been linted with; a finding here means the
# gate is red — fix the finding, never loosen the config.

linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
